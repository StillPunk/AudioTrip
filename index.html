<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AudioSurf WEB</title>
  <link rel="stylesheet" href="index.css"/>
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.165.0",
        "three/addons/": "https://esm.sh/three@0.165.0/examples/jsm/",
        "three/": "https://esm.sh/three@^0.179.1/"
      }
    }
  </script>
</head>

<body>
<div id="ui-container">
  <div id="vignette"></div>

  <div id="start-screen">
    <h1>AudioSurf</h1>
    <p id="start-prompt">
      Enter a song to start your ride
      <br>
      <small>(VPN may be required)</small>
    </p>

    <div id="search-container">
      <input type="text" id="song-search-input" placeholder="Artist - Song Title..." autocomplete="off">
      <div id="autocomplete-results" class="hidden"></div>
    </div>

    <p class="or-separator">OR</p>

    <label for="audio-file-input" class="file-label" id="file-label">Select Local Audio File</label>
    <input type="file" id="audio-file-input" accept="*"/>
  </div>

  <div id="loading-screen" class="hidden">
    <p id="loading-text">Loading...</p>
    <p id="analysis-text" class="hidden">Analyzing your ride...</p>
  </div>

  <div id="game-hud" class="hidden">
    <div id="score-container">
      Score: <span id="score">0</span> <span id="score-multiplier"></span>
    </div>
    <button id="pause-button">⏸</button>
  </div>

  <div id="pause-menu" class="hidden">
    <h1>Paused</h1>
    <button id="resume-button">Resume</button>
    <button id="main-menu-button">Main Menu</button>
  </div>

  <div id="style-rank-container" class="hidden">
    <img id="rank-image" src="" alt="Current Rank"/>
    <div id="progress-bar-container">
      <div id="progress-bar-fill"></div>
    </div>
  </div>

  <div id="end-screen" class="hidden">
    <h1>Ride Complete!</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <button id="restart-button">Play Again</button>
  </div>
</div>
<canvas id="webgl-canvas"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script type="module" src="index.js"></script>
</body>
</html>
