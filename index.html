<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AudioSurf WEB</title>
  <link rel="stylesheet" href="index.css"/>
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.165.0",
        "three/addons/": "https://esm.sh/three@0.165.0/examples/jsm/",
        "three/": "https://esm.sh/three@^0.179.1/"
      }
    }
  </script>
</head>

<body>
<div id="ui-container">
  <div id="vignette"></div>

  <div id="start-screen">
    <h1>AudioSurf</h1>
    <p id="start-prompt">Choose a song to start your ride</p>
    <label for="audio-file-input" class="file-label" id="file-label">Select Audio File</label>
    <input type="file" id="audio-file-input" accept="audio/*"/>
  </div>

  <div id="loading-screen" class="hidden">
    <p id="loading-text">Loading...</p>
    <p id="analysis-text" class="hidden">Analyzing your ride...</p>
  </div>

  <div id="score-container" class="hidden">
    Score: <span id="score">0</span>
  </div>

  <div id="end-screen" class="hidden">
    <h1>Ride Complete!</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <button id="restart-button">Play Again</button>
  </div>
</div>
<canvas id="webgl-canvas"></canvas>
<script type="module" src="index.js"></script>
</body>
</html>
